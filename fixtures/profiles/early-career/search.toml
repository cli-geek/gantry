schema_version = 1
occupations = ["technology"]

[titles]
mode = "hard"
targets = ["Backend Engineer", "Software Engineer"]
# Suggested at onboarding but not confirmed, so not used.
synonyms = [{ text = "Platform Engineer", verified = false }]
exclude = ["Senior", "Staff", "Intern"]

[experience]
mode = "hard"
max_required_years = 3

[location]
mode = "hard"
home = "San Francisco, CA"
max_distance = { value = 25, unit = "mi" }
work_modes = ["remote", "hybrid"]
remote_eligible = ["US"]

[pay]
mode = "hard"
minimum = 125000
period = "year"
currency = "USD"
keep_unlisted = true

[requirements]
sponsorship = "hard"
clearance = "hard"

[freshness]
max_age_days = 45
