[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
gantry-core = { path = "crates/gantry-core" }
gantry-platform = { path = "crates/gantry-platform" }
gantry-store = { path = "crates/gantry-store" }
gantry-discovery = { path = "crates/gantry-discovery" }
gantry-cmd = { path = "crates/gantry-cmd" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
jiff = { version = "0.2", features = ["serde"] }
keyring-core = "1"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6"
schemars = "1.2"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
