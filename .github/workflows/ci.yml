name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Linux is the supported platform; Windows and macOS build and test from
  # M0 so a Linux-only assumption fails here instead of at the port (§3.3).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Fixed architecture boundaries (§3.1, §3.4).
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only gantry-platform may contain OS conditionals
        run: |
          if grep -rnE 'cfg\((not\()?(any\()?(target_os|unix|windows)' crates --include='*.rs' \
               | grep -v '^crates/gantry-platform/'; then
            echo "OS-specific code belongs in crates/gantry-platform" >&2
            exit 1
          fi
      - name: The CLI depends on gantry-cmd only
        run: |
          if grep -nE '^gantry-(core|platform|store|discovery)' crates/gantry-cli/Cargo.toml; then
            echo "gantry-cli must reach other crates through gantry-cmd" >&2
            exit 1
          fi
