# Core question bank, sections A (identity and contact) and B (education).
# Format and rules: docs/question-bank.md.

[[question]]
id = "profile.name.legal_first"
section = "A"
label = "Legal first name"
sensitivity = "contact"
answer_type = "text"
weight = 2
intake_rank = 1
variants = [
  { text = "First Name", ats = "greenhouse" },
  { text = "What is your legal first name?", ats = "greenhouse" },
  { text = "Prénom", ats = "greenhouse", note = "French-language form." },
]

[[question]]
id = "profile.name.legal_middle"
section = "A"
label = "Legal middle name or initial"
sensitivity = "contact"
answer_type = "text"
optional = true

[[question]]
id = "profile.name.legal_last"
section = "A"
label = "Legal last name"
sensitivity = "contact"
answer_type = "text"
weight = 2
intake_rank = 2
variants = [
  { text = "Last Name", ats = "greenhouse" },
  { text = "Nom", ats = "greenhouse", note = "French-language form." },
]

[[question]]
id = "profile.name.suffix"
section = "A"
label = "Name suffix (Jr., III)"
sensitivity = "contact"
answer_type = "text"
