[[question]]
id = "profile.referral.default_source"
section = "A"
label = "Default answer to \"How did you hear about this job?\""
sensitivity = "preference"
answer_type = "enum"
options = ["careers_site", "linkedin", "job_board", "search_engine", "social_media", "referral", "recruiter", "event", "campus_or_community", "company_content", "other"]
weight = 2
intake_rank = 11
variants = [
  { text = "How did you hear about this job?", ats = "greenhouse" },
  { text = "How did you hear about Twilio?", ats = "greenhouse" },
  { text = "How did you first hear about this opportunity?", ats = "greenhouse" },
  { text = "How did you hear about this opportunity?", ats = "greenhouse" },
  { text = "How did you hear about this role? (Please select all that apply)", ats = "greenhouse" },
  { text = "How did your hear about this position?", ats = "greenhouse" },
]

[question.options_normalization]
careers_site = ["Career Page", "Company Website (Airbnb Careers)", "Careers Website", "Dropbox Career Site", "Datadog's Careers Page"]
linkedin = ["LinkedIn", "LinkedIn (Job Posting)", "LinkedIn (Datadog Page)"]
job_board = ["Job Board", "BuiltIn", "BuiltIn Boston", "BuiltIn NYC", "Indeed", "Glassdoor", "Angelist", "Flexjobs", "Hired", "Hiretual", "The Muse", "Welcome to the Jungle", "JobTeaser", "Underdog", "Thrive", "Blind App", "InHerSight", "PompCryptoJobs", "Dropbox Talent Community"]
