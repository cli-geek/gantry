variants = [
  { text = "Preferred First Name", ats = "greenhouse" },
  { text = "What's the name you'd prefer us to use throughout the interview process?", ats = "greenhouse" },
  { text = "Prénom préféré", ats = "greenhouse", note = "French-language form." },
]

[[question]]
id = "profile.name.pronouns"
section = "A"
label = "Pronouns"
sensitivity = "preference"
answer_type = "enum"
options = ["he_him", "she_her", "they_them", "other", "ask_me"]
optional = true
variants = [
  { text = "Pronouns", ats = "greenhouse" },
  { text = "What are your personal pronouns?", ats = "greenhouse" },
]

[question.options_normalization]
he_him = ["he/him/his", "He / Him / His"]
she_her = ["she/her/hers", "She / Her / Hers"]
they_them = ["they/them/theirs", "They / Them / Their"]
other = ["self-describe", "Zie / Ze / Zir / Hir / Zir", "Other - Please ask me"]
ask_me = ["Multiple pronouns - Please ask me", "Please use my name"]

