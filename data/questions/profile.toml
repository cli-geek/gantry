[[question]]
id = "profile.education.highest_level"
section = "B"
label = "Highest level of education completed"
sensitivity = "contact"
answer_type = "enum"
options = ["none", "high_school", "some_college", "certificate", "associate", "bachelors", "masters", "professional", "doctorate"]
intake_rank = 22
variants = [
  { text = "What is the highest level of education you have completed?", ats = "greenhouse" },
  { text = "What is the most recent degree you obtained?", ats = "greenhouse", note = "Asks for the most recent degree; answer with the highest level." },
]

[question.options_normalization]
none = []
high_school = ["High School"]
some_college = []
certificate = []
associate = ["Associate's Degree"]
bachelors = ["B.A./ B.S.", "Bachelor's Degree"]
masters = ["M.A./ M.S.", "Master's Degree", "Master of Business Administration (M.B.A.)"]
professional = ["Doctor of Medicine (M.D.)", "Juris Doctor (J.D.)"]
doctorate = ["Ph.D", "Doctor of Philosophy (Ph.D.)"]

[[question]]
id = "profile.education.has_bachelors"
section = "B"
label = "Has a bachelor's degree or higher"
sensitivity = "contact"
answer_type = "bool"
derive = [
  { from = "profile.education.highest_level", equals = "none", value = false },
  { from = "profile.education.highest_level", equals = "high_school", value = false },
  { from = "profile.education.highest_level", equals = "some_college", value = false },
  { from = "profile.education.highest_level", equals = "certificate", value = false },
  { from = "profile.education.highest_level", equals = "associate", value = false },
  { from = "profile.education.highest_level", equals = "bachelors", value = true },
  { from = "profile.education.highest_level", equals = "masters", value = true },
  { from = "profile.education.highest_level", equals = "professional", value = true },
  { from = "profile.education.highest_level", equals = "doctorate", value = true },
]

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

