social_media = ["Social media (Facebook, LinkedIn, Twitter, Instagram)", "Twitter", "Twitter Ad", "Instagram", "Facebook", "Farcaster", "Github", "Hacker News"]
referral = ["Referral", "Family/Friend", "Friend, family, colleague", "Airbnb Employee", "Current Pinterest Employee", "Datadog Employee", "Referral from Dropboxer", "Advisor or Faculty referral"]
recruiter = ["Contacted by Recruiter"]
event = ["Conference", "Event (Tech Talk, Meetup, conference)", "Coinbase Event", "Conference or Event", "Attended a talk or conference", "Event", "In Person Event", "Pinterest-hosted Recruiting Event"]
campus_or_community = ["On Campus Recruiting", "Campus Event", "School job board", "Carnegie Mellon University department or mailing list", "ColorStack", "Break Through Tech", "Girls Who Code", "AfroTech", "Rewriting the Code", "SHPE (Society of Hispanic Professional Engineers)", "MLT (Management Leadership for Tomorrow)"]
company_content = ["Airbnb Open Source", "Airbnb Tech blog post", "Airbnb.io", "Coinbase Blog", "Twilio Blog", "Content (e.g. videos, ads, billboards etc)", "I love Datadog's product!"]
