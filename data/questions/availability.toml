[[question]]
id = "availability.work_mode"
section = "F"
label = "Where do you want to work?"
sensitivity = "availability"
answer_type = "enum"
options = ["remote_only", "hybrid", "onsite", "flexible"]
intake_rank = 20
variants = [
  { text = "If this role offers the option to work from a remote location, do you plan to work remotely?", ats = "greenhouse", note = "Two-option form: remote_only answers the remote option, anything else the office option." },
]

[question.options_normalization]
remote_only = ["Remote only", "Yes, I intend to work remotely."]
hybrid = ["Hybrid"]
onsite = ["On-site", "Onsite", "No, I intend to work from an office location."]
flexible = ["Flexible", "No preference"]

[[question]]
id = "availability.willing_onsite"
section = "F"
label = "Are you willing to work from an office?"
sensitivity = "availability"
answer_type = "bool"
derive = [
  { from = "availability.work_mode", equals = "remote_only", value = false },
]
variants = [
  { text = "Are you willing to work from the office(s) listed on the job description?", ats = "greenhouse" },
]

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

[[question]]
id = "availability.relocation.willing"
section = "F"
label = "Are you willing to relocate?"
sensitivity = "availability"
answer_type = "bool"
intake_rank = 19
variants = [
  { text = "Are you currently based in Canada, or willing to relocate to Canada?", ats = "greenhouse", note = "Composite: already based there or willing to relocate. Answer yes if either holds." },
  { text = "Are you currently based in US or willing to relocate to US?", ats = "greenhouse", note = "Composite: already based there or willing to relocate. Answer yes if either holds." },
  { text = "Are you currently based in or willing to relocate to the Bay Area for this position?", ats = "greenhouse", note = "Composite: already based there or willing to relocate. Answer yes if either holds." },
  { text = "Are you currently based in or willing to relocate to the Bay Area or Los Angeles area for this position?", ats = "greenhouse", note = "Composite: already based there or willing to relocate. Answer yes if either holds." },
  { text = "This position is based in Mexico City, do you live in Mexico CIty or are you willing to relocate?", ats = "greenhouse", note = "Composite: already based there or willing to relocate. Answer yes if either holds." },
  { text = "Do you live in or plan to relocate to Poland?", ats = "greenhouse", note = "Composite: already based there or willing to relocate. Answer yes if either holds." },
  { text = "If not currently in the SF Bay Area, are you willing to relocate to the SF Bay Area for this position?", ats = "greenhouse" },
]

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

