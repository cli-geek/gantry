# Core question bank, section F (availability and logistics).
# Format and rules: docs/question-bank.md.

[[question]]
id = "availability.schedule.weekly"
section = "F"
label = "Weekly availability: days and time ranges"
sensitivity = "availability"
answer_type = "grid"
variants = [
  { text = "The role requires availability Sunday to Thursday OR Tuesday to Saturday, between 6 AM and 9 PM local time. Do you have any scheduling restrictions or conflicts with this work schedule?", ats = "greenhouse", note = "Yes/no scheduling-conflict question: answered by comparing the grid with the stated hours." },
]

[[question]]
id = "availability.hours.desired_per_week"
section = "F"
label = "Desired hours per week"
sensitivity = "availability"
answer_type = "number"

[[question]]
id = "availability.hours.max_per_week"
section = "F"
label = "Maximum hours per week"
sensitivity = "availability"
answer_type = "number"
optional = true

[[question]]
id = "availability.hours.overtime"
section = "F"
label = "Are you open to overtime?"
sensitivity = "availability"
answer_type = "bool"
optional = true

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

[[question]]
id = "availability.hours.holidays"
section = "F"
label = "Are you available to work holidays?"
sensitivity = "availability"
answer_type = "bool"
optional = true

[question.options_normalization]
