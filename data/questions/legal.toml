# Core question bank, sections C (work authorization and legal) and D (security clearance).
# Format and rules: docs/question-bank.md.

[[question]]
id = "legal.authorization.citizenship_countries"
section = "C"
label = "Countries of citizenship"
sensitivity = "legal"
answer_type = "list"

[[question]]
id = "legal.authorization.us_citizen"
section = "C"
label = "Are you a US citizen?"
sensitivity = "legal"
answer_type = "bool"
intake_rank = 12
jurisdiction_note = "US wording; other countries ask about work permits or right to work."

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

[[question]]
id = "legal.authorization.us_permanent_resident"
section = "C"
label = "Are you a US lawful permanent resident?"
sensitivity = "legal"
answer_type = "bool"
intake_rank = 13
jurisdiction_note = "US wording; other countries ask about work permits or right to work."
derive = [
  { from = "legal.authorization.us_citizen", equals = true, value = false },
]
variants = [
  { text = "Are you a US citizen or lawful permanent resident?", ats = "greenhouse", note = "Composite: citizen or permanent resident. Answer yes if either is yes." },
]

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

[[question]]
id = "legal.authorization.us_person"
section = "C"
label = "Are you a \"U.S. person\" under ITAR/EAR (citizen, permanent resident, refugee or asylee)?"
sensitivity = "legal"
answer_type = "bool"
jurisdiction_note = "US export-control definition (ITAR and EAR)."
derive = [
  { from = "legal.authorization.us_citizen", equals = true, value = true },
  { from = "legal.authorization.us_permanent_resident", equals = true, value = true },
]

[question.options_normalization]
yes = ["Yes"]
no = ["No"]

[[question]]
id = "legal.authorization.authorized_us"
