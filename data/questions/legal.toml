no = ["No"]

[[question]]
id = "legal.authorization.require_sponsorship_future"
section = "C"
label = "Will you require visa sponsorship to work in the future?"
sensitivity = "legal"
answer_type = "bool"
weight = 2
intake_rank = 16
jurisdiction_note = "US wording; other countries ask about work permits."
derive = [
  { from = "legal.authorization.us_citizen", equals = true, value = false },
  { from = "legal.authorization.us_permanent_resident", equals = true, value = false },
]
variants = [
  { text = "Do you now or will you in the future need sponsorship for employment visa status in the country in which you are applying?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Do you now or will you in the future require immigration sponsorship to work at Cloudflare?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Do you now, or will you in the future, require immigration sponsorship to work at Reddit?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Do you, now or in the future, require sponsorship to work in the United States?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now (or in the future) require visa sponsorship in order to work in the US?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now or in the future require immigration sponsorship to work for Instacart?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you require Stripe to sponsor you for a work permit now or in the future for the location(s) you selected in in your previous response?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you require our assistance with work authorization now or in the future?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you require sponsorship for employment visa status now or in the future?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now or in the future require company sponsorship to retain or extend your work authorization in the country where the job is located?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now or in the future require sponsorship for a visa to remain in your current location?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now or in the future require sponsorship for work authorization?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
  { text = "Will you now or in the future require sponsorship or a visa transfer for employment visa status (ie: H-1B visa)?", ats = "greenhouse", note = "Composite: now or in the future. Answer yes if either sponsorship answer is yes." },
]

[question.options_normalization]
yes = ["Yes", "Yes, I will require immigration sponsorship in the future to legally work in the country where the job is located.", "Yes, I will require immigration sponsorship now to legally work in the country where the job is located.", "Yes, I require sponsorship for work authorization in the offer location", "Yes, I require sponsorship or a visa transfer (eg: J-1, F-1 CPT/OPT, H-1B, TN, etc.)", "Yes, EU Blue Card", "Yes, F-1 Visa OPT (USA)", "Yes, Ireland Highly Skilled Worker Visa", "Yes, Netherlands Highly Skilled Migrant Visa", "Yes, USMCA Professional (TN) Visa (USA)", "Yes, but not one of the visas listed here"]
no = ["No", "No, I do not and will not require immigration sponsorship to legally work in the country where the job is located.", "No, I can work for any employer in the offer location without sponsorship", "No, I can work for any US employer without sponsorship (eg: US citizen, permanent resident, EAD, etc.)"]

