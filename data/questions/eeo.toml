# Core question bank, section E (voluntary self-identification).
# Every question defaults to decline; real answers are used only when set
# explicitly and eeo.autofill is true. Format and rules: docs/question-bank.md.

[[question]]
id = "eeo.gender"
section = "E"
label = "Gender"
sensitivity = "eeo"
answer_type = "enum"
options = ["female", "male", "non_binary", "other"]
weight = 2
default_policy = "decline"
variants = [
  { text = "Gender", ats = "greenhouse" },
  { text = "Voluntary Self-Identification of Gender", ats = "greenhouse" },
]

[question.options_normalization]
female = ["Female"]
male = ["Male"]
non_binary = ["Gender Nonconforming"]
other = ["Other"]

[[question]]
id = "eeo.gender_identity"
section = "E"
label = "Gender identity"
sensitivity = "eeo"
answer_type = "enum"
options = ["woman", "man", "non_binary", "genderqueer", "agender", "genderfluid", "other"]
default_policy = "decline"
variants = [
  { text = "Gender Identity", ats = "greenhouse" },
  { text = "Gender Identity (optional)", ats = "greenhouse" },
  { text = "What gender identity do you most closely identify with?", ats = "greenhouse" },
  { text = "What is your gender or gender identity?", ats = "greenhouse" },
]

[question.options_normalization]
woman = ["Woman", "Female"]
man = ["Man", "Male"]
non_binary = ["Non-binary", "Non-Conforming/Non Binary", "Non-Conforming/Non-Binary/Third Gender", "Non-binary or third gender", "Gender non-conforming"]
genderqueer = ["Genderqueer"]
agender = ["Agender"]
genderfluid = ["Genderfluid"]
other = ["Not listed", "Not Listed"]

