section = "E"
label = "Veteran status (VEVRAA)"
sensitivity = "eeo"
answer_type = "enum"
options = ["protected_veteran", "not_protected_veteran", "active_duty", "reserve_or_guard", "never_served"]
weight = 2
default_policy = "decline"
