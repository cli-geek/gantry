variants = [
  { text = "VeteranStatus", ats = "greenhouse" },
  { text = "Veteran Status", ats = "greenhouse" },
  { text = "Protected Veteran Status", ats = "greenhouse" },
  { text = "Military Veteran Status", ats = "greenhouse" },
  { text = "What is your military status?", ats = "greenhouse" },
]

[question.options_normalization]
