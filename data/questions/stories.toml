# Section H: behavioral story bank (plan 7.3). One STAR record per prompt.
# Every prompt is a `list` with min_items = 1. `stories.proudest_work` is the
# intake story (rank 28) and a projection source for the other prompts.

[[question]]
id = "stories.hardest_problem"
section = "H"
label = "Hardest problem you solved at work or school"
sensitivity = "free_text"
answer_type = "list"
min_items = 1
draws_on = [
  "experience.total_years",
  "experience.jobs",
  "experience.bullets",
  "experience.projects",
  "experience.skills",
  "stories.proudest_work",
]
fields = [
  { name = "situation", label = "Situation: the context and what was at stake", answer_type = "text" },
  { name = "task", label = "Task: what you were responsible for", answer_type = "text" },
  { name = "action", label = "Action: what you did, in your own words", answer_type = "text" },
  { name = "result", label = "Result: what happened", answer_type = "text" },
  { name = "metric", label = "Metric: a number or measurable outcome, if you have one", answer_type = "text", optional = true },
  { name = "experience", label = "Linked experience (employer, school or project)", answer_type = "text", optional = true },
]
variants = [
  { text = "Tell us about a time you were working toward an important goal and hit an unexpected obstacle that put your success at risk. What was the goal, what got in the way, and what specific steps did you take to get back on track? What was the outcome?", ats = "greenhouse", note = "Long-form obstacle prompt; one board." },
]

